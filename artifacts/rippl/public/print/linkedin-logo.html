<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rippl — LinkedIn Logo (300×300)</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 16px;
      font-family: 'DM Sans', sans-serif;
      padding: 40px;
    }

    .label {
      font-size: 12px;
      color: #64748b;
      font-family: 'DM Sans', sans-serif;
    }

    /* ── The actual logo square ── */
    .logo-square {
      width: 300px;
      height: 300px;
      background: #0a1f35;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* Ripple rings — decorative, bottom-right */
    .ring {
      position: absolute;
      border-radius: 50%;
      right: -40px;
      bottom: -40px;
    }
    .ring-1 { width: 120px; height: 120px; border: 1px solid rgba(224,98,42,.28); }
    .ring-2 { width: 190px; height: 190px; border: 1px solid rgba(224,98,42,.18); }
    .ring-3 { width: 260px; height: 260px; border: 1px solid rgba(224,98,42,.10); }
    .ring-4 { width: 340px; height: 340px; border: 1px solid rgba(224,98,42,.06); }

    /* Subtle glow */
    .glow {
      position: absolute;
      right: -10px;
      bottom: -10px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(224,98,42,.25) 0%, transparent 70%);
    }

    /* Wordmark */
    .wordmark {
      font-family: 'DM Sans', sans-serif;
      font-size: 72px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -2px;
      color: #fff;
      z-index: 1;
    }
    .wordmark span { color: #E0622A; }
  </style>
</head>
<body>

  <div class="label">LinkedIn Logo — screenshot at 300 × 300 px</div>

  <div class="logo-square">
    <div class="ring ring-1"></div>
    <div class="ring ring-2"></div>
    <div class="ring ring-3"></div>
    <div class="ring ring-4"></div>
    <div class="glow"></div>
    <div class="wordmark">rip<span>pl</span></div>
  </div>

  <div class="label">Open in browser → screenshot at 100% zoom, crop to 300 × 300</div>

</body>
</html>
